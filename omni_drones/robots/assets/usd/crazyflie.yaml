# origin
update_sim: True
name: crazyflie
LPF_coef: 1.0 # low-pass filter, 1.0 means all pass
target_clip: 1.0
min_thrust_ratio: 0.0
max_thrust_ratio: 0.9
fixed_yaw: 0
# [CFB 2026-09-09] Crazyflie Brushless (无刷, 带桨保护+动捕球) 参数, 论文
#   "How to Model Your Crazyflie Brushless" (arXiv:2603.05944) Table II:
#   m=44g(带桨保护)/40g(不带); J=diag([3.3,3.6,5.9])e-5(带桨保护)。
#   本机实测 42g -> mass=0.042(论文 44g 备选 0.044)。惯量沿用论文带桨保护值。
inertia:
  xx: 3.3e-5
  xy: 0.0
  xz: 0.0
  yy: 3.6e-5
  yz: 0.0
  zz: 5.9e-5
mass: 0.042 # CFB 实测 42g (论文 44g 带桨保护; 空心杯原 0.0321)
l: 0.096
drag_coef: 0.0
rotor_configuration:
  arm_lengths:
  - 0.043
  - 0.043
  - 0.043
  - 0.043
  directions:
  - -1.0
  - 1.0
  - -1.0
  - 1.0
  force_constants:
  # [CFB] KF = omega_max^2 * force_constants = 满油门单电机推力。
  #   论文 CFB 单电机满油门推力 0.289 N (T2W≈3:1 @42g); omega_max=K=2900 rad/s
  #   -> force_constants = 0.289 / 2900^2 = 3.4364e-08 (空心杯原 2.3503e-08 @2315)
  - 3.43639e-08
  - 3.43639e-08
  - 3.43639e-08
  - 3.43639e-08
  max_rotation_velocities:     
  - 2900     # [CFB] K=2900 rad/s (论文; 空心杯 2315 rps)
  - 2900
  - 2900
  - 2900
  moment_constants:
  - 1.058e-9 # [CFB] 保持 KM/KF 比例与原调好模型一致: KM_phys 与 KF_phys 同放大 x2.29
  - 1.058e-9 #   (=0.289/0.126), 已含 omega_max 2315->2900 的影响 (7.24e-10*2.29*(2315/2900)^2)
  - 1.058e-9 #   更精细可另按论文 tau_f 多项式标定 (每电机满油门 ~8.2e-4 Nm)
  - 1.058e-9
  num_rotors: 4
  rotor_angles:
  - 0.78539816
  - 2.35619449
  - 3.92699082
  - 5.49778714
  time_constant: 0.05 # [CFB] 电机一阶时间常数 T=50ms (论文; 空心杯 0.025)
  noise_scale: 0.0 # default: 2% noise for rotor speed
controller_configuration: # invalid
  gain:
  - 0.0052
  - 0.0052
  - 0.00025